<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Pedidos - Pizzaria do Gordo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/png" href="https://github.com/user-attachments/assets/b6cbf35d-93a5-4eb7-ad70-63a79c657b7a">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--red:#c0181a;--red-dk:#8b0f11;--green:#1b6b2e;--green-dk:#0f4a1e;--gold:#d4a017;--gold-lt:#f0c040;--cream:#fbf6ee;--cream-dk:#f0e8d8;--white:#fff;--charcoal:#1c1c1c;--dark:#111;--gray:#777;--border:#e2d8cc}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"DM Sans",sans-serif;background:var(--cream-dk);color:var(--charcoal)}
button,input,textarea{font:inherit}
.flag-stripe{height:4px;background:linear-gradient(90deg,var(--green) 33.3%,#fff 33.3% 66.6%,var(--red) 66.6%)}

/* ---------- Header ---------- */
header{background:#fff;border-bottom:3px solid var(--red);box-shadow:0 2px 14px #0001;position:sticky;top:0;z-index:50}
.hd-inner{max-width:1400px;margin:auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hd-brand{display:flex;align-items:center;gap:12px}
.hd-logo{width:46px;height:46px;border-radius:50%;border:2px solid var(--red);overflow:hidden;flex:none;background:#fff}
.hd-logo img{width:100%;height:100%;object-fit:cover}
.hd-title{font-family:"Bebas Neue";font-size:1.35rem;letter-spacing:1.5px;line-height:1.05}
.hd-title span{color:var(--red)}
.hd-sub{font-size:.68rem;color:var(--gray);letter-spacing:1px;text-transform:uppercase}
.hd-clock{text-align:right}
.hd-clock .time{font-family:"Bebas Neue";font-size:1.5rem;color:var(--charcoal);letter-spacing:1px}
.hd-clock .date{font-size:.68rem;color:var(--gray);text-transform:capitalize}

/* ---------- Layout ---------- */
.shell{max-width:1400px;margin:auto;padding:22px 24px 70px;display:grid;grid-template-columns:1fr 400px;gap:22px;align-items:start}

/* ---------- Menu column ---------- */
.tabs-bar{display:flex;gap:3px;background:#fff;border:2px solid var(--border);border-radius:8px;padding:4px;width:fit-content;margin-bottom:16px;box-shadow:0 2px 8px #0001}
.tab-btn{padding:10px 18px;border:0;border-radius:5px;background:transparent;color:var(--gray);cursor:pointer;font-size:.72rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.tab-btn:hover{background:var(--cream-dk);color:#111}
.tab-btn.active{background:var(--red);color:#fff}
.tab-btn.tab-doce.active{background:#7b3f00}
.tab-btn.tab-beb.active{background:var(--green)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.item-list{display:flex;flex-direction:column;gap:8px}
.item-row{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;transition:.15s}
.item-row:hover{border-color:var(--red);box-shadow:0 3px 10px #c0181a14}
.item-info{flex:1;min-width:0}
.item-name{font-weight:800;font-size:.92rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item-tag{font-size:.56rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:var(--red);color:#fff}
.item-tag.gold{background:var(--gold);color:#111}
.item-tag.green{background:var(--green);color:#fff}
.item-desc{font-size:.76rem;color:var(--gray);margin-top:2px;line-height:1.4}
.item-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.item-price{font-family:"Bebas Neue";font-size:1.05rem;color:var(--red);white-space:nowrap}
.btn-tam{border:0;border-radius:6px;background:var(--red);color:#fff;padding:8px 13px;font-size:.68rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.btn-tam:hover{background:var(--red-dk)}
.btn-tam.doce{background:#7b3f00}
.btn-add-drink{width:32px;height:32px;border:0;border-radius:6px;background:var(--green);color:#fff;cursor:pointer;font-size:.85rem}
.btn-add-drink:hover{background:var(--green-dk)}
.drink-cat{font-family:"Bebas Neue";font-size:1.15rem;letter-spacing:1.5px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.drink-cat:first-child{margin-top:0}

/* ---------- Order column ---------- */
.order-col{position:sticky;top:90px;background:#fff;border:2px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 6px 24px #0001}
.order-hd{background:#111;color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.order-hd h3{font-family:"Bebas Neue";font-size:1.25rem;letter-spacing:2px;display:flex;align-items:center;gap:9px}
.order-hd h3 i{color:var(--gold-lt)}
.order-count{background:var(--red);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:.75rem;font-weight:800}
.order-bd{padding:16px 18px;max-height:calc(100vh - 190px);overflow-y:auto}
.cart-empty{text-align:center;color:var(--gray);padding:30px 10px;font-size:.85rem}
.cart-empty i{font-size:2.2rem;color:var(--border);display:block;margin-bottom:10px}
.citem{background:var(--cream);border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px}
.citem-top{display:flex;justify-content:space-between;gap:8px}
.citem-name{font-weight:800;font-size:.82rem}
.citem-price{font-family:"Bebas Neue";font-size:1.15rem;color:var(--red);white-space:nowrap}
.citem-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.citem-unit{font-size:.7rem;color:var(--gray)}
.qty-ctrl{display:flex;align-items:center;gap:6px}
.qty-btn{width:23px;height:23px;border-radius:4px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-weight:800;font-size:.78rem}
.qty-btn:hover{background:var(--red);border-color:var(--red);color:#fff}
.qty-num{min-width:16px;text-align:center;font-weight:800;font-size:.82rem}
.btn-del{width:23px;height:23px;border-radius:4px;border:1.5px solid var(--border);background:#fff;color:var(--gray);cursor:pointer;font-size:.68rem}
.btn-del:hover{background:var(--red-dk);border-color:var(--red-dk);color:#fff}

.sec-block{margin-top:16px;padding-top:14px;border-top:1.5px dashed var(--border)}
.sec-lbl{font-size:.63rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.fl-lbl{display:block;font-size:.63rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gray);margin-bottom:4px}
.fl-inp{width:100%;padding:9px 11px;border-radius:6px;border:1.5px solid var(--border);background:#fff;outline:0}
.fl-inp:focus{border-color:var(--green)}
.fl-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fl-row.addr2{grid-template-columns:1fr 74px}
.req{color:var(--red)}

.mode-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mopt{border:2px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;background:#fff}
.mopt i{display:block;font-size:1.3rem;color:var(--gray);margin-bottom:5px}
.mopt.sel.presencial{border-color:var(--gold);background:#d4a01714}
.mopt.sel.presencial i{color:var(--gold)}
.mopt.sel.delivery{border-color:var(--green);background:#1b6b2e12}
.mopt.sel.delivery i{color:var(--green)}
.mopt-lbl{font-size:.68rem;font-weight:800;text-transform:uppercase;color:var(--gray)}
.mopt.sel .mopt-lbl{color:#111}

.pay-methods{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.popt{background:#fff;border:2px solid var(--border);border-radius:8px;padding:10px;text-align:center;cursor:pointer}
.popt.sel{border-color:var(--green);background:#1b6b2e12}
.popt i{display:block;font-size:1.2rem;color:var(--gray);margin-bottom:4px}
.popt.sel i{color:var(--green)}
.popt span{font-size:.65rem;font-weight:800;text-transform:uppercase}
.troco-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tchip{border:1.5px solid #d4a01766;background:#fff;border-radius:20px;padding:6px 12px;font-size:.74rem;font-weight:800;cursor:pointer}
.tchip.sel{background:var(--gold);border-color:var(--gold);color:#111}
.obs-inp{min-height:56px;resize:vertical}

.sum-row{display:flex;justify-content:space-between;font-size:.85rem;color:var(--gray);margin-bottom:6px}
.sum-row.total{border-top:2px solid var(--border);padding-top:10px;margin-top:6px;color:#111;font-weight:800}
.sum-row.total .val{font-family:"Bebas Neue";font-size:1.5rem;color:var(--red)}

.btn-print{width:100%;border:0;border-radius:8px;padding:13px;font-size:.8rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:8px}
.btn-print.kitchen{background:var(--green);color:#fff}
.btn-print.kitchen:hover{background:var(--green-dk)}
.btn-print.client{background:var(--red);color:#fff}
.btn-print.client:hover{background:var(--red-dk)}
.btn-print:disabled{opacity:.4;cursor:not-allowed}
.btn-new{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:11px;font-size:.74rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;background:#fff;color:var(--gray);margin-top:10px}
.btn-new:hover{border-color:var(--red);color:var(--red)}

/* ---------- Size modal ---------- */
.sz-overlay{position:fixed;inset:0;z-index:300;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}
.sz-overlay.open{opacity:1;pointer-events:auto}
.sz-modal{background:#fff;border-radius:16px;width:100%;max-width:460px;box-shadow:0 24px 60px #0005;overflow:hidden;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);display:flex;flex-direction:column}
.sz-hd{background:linear-gradient(135deg,var(--red-dk),var(--red));padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;color:#fff;flex:none}
.sz-hd h3{font-family:"Bebas Neue";font-size:1.35rem;letter-spacing:2px}
.sz-pname{display:block;font-size:.85rem;color:#ffffffd9;margin-top:3px}
.mod-x{border:0;border-radius:50%;background:#ffffff33;color:#fff;width:30px;height:30px;cursor:pointer;flex:none}
.sz-bd{padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.size-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.sopt{border:2px solid var(--border);border-radius:10px;padding:11px 5px;text-align:center;cursor:pointer;background:#fff}
.sopt:hover,.sopt.sel{border-color:var(--red);background:#c0181a0f}
.sopt-ltr{display:block;font-family:"Bebas Neue";font-size:1.4rem;color:var(--red);line-height:1}
.sopt-sl{display:block;font-size:.6rem;color:var(--gray)}
.sopt-val{display:block;font-family:"Bebas Neue";font-size:1.1rem}
.borda-sec{background:#d4a01714;border:1.5px solid #d4a0174d;border-radius:10px;padding:13px;margin-bottom:14px}
.borda-title{font-size:.62rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
.borda-chips{display:flex;gap:7px;flex-wrap:wrap}
.bchip{border:1.5px solid #d4a01766;background:#fff;border-radius:20px;padding:6px 12px;font-size:.74rem;font-weight:800;cursor:pointer}
.bchip.sel{background:var(--gold);border-color:var(--gold);color:#111}
.sz-prev{text-align:center;color:var(--gray);font-size:.83rem;margin-bottom:12px}
.sz-prev strong{font-family:"Bebas Neue";font-size:1.3rem;color:var(--red)}
.btn-add-sz{width:100%;border:0;border-radius:6px;background:var(--green);color:#fff;padding:13px;font-size:.82rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.btn-add-sz:disabled{opacity:.45;cursor:not-allowed}
.meio-toggle{background:#d4a01714;border:1.5px solid #d4a0174d;border-radius:10px;padding:13px;margin-bottom:14px}
.meio-title{font-size:.62rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.frac-chips{display:flex;gap:7px;margin-bottom:11px}
.fchip{flex:1;border:1.5px solid #d4a01766;background:#fff;border-radius:8px;padding:9px 6px;text-align:center;font-size:.73rem;font-weight:800;cursor:pointer;text-transform:uppercase}
.fchip.sel{background:var(--gold);border-color:var(--gold);color:#111}
.flavor-slots{display:flex;flex-direction:column;gap:8px}
.flavor-slot-lbl{display:block;font-size:.63rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gray);margin-bottom:4px}
.meio-second select{cursor:pointer}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;z-index:500;transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;background:var(--green);color:#fff;border-radius:8px;padding:11px 22px;font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:7px;box-shadow:0 8px 22px #0003;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.warn{background:var(--red)}

/* ---------- Print receipts (hidden on screen) ---------- */
#print-area{display:none}
.receipt{width:48mm;font-family:"DM Sans",sans-serif;color:#000;font-size:11px;line-height:1.4}
.r-center{text-align:center}
.r-title{font-family:"Bebas Neue";font-size:16px;letter-spacing:1px}
.r-sub{font-size:9px}
.r-line{border-top:1px dashed #000;margin:5px 0}
.r-tag{font-family:"Bebas Neue";font-size:13px;letter-spacing:1px;text-align:center;border:1.5px solid #000;padding:3px 0;margin:5px 0}
.r-row{display:flex;justify-content:space-between;gap:6px;font-size:11px}
.r-item{margin-bottom:5px}
.r-item .r-row{font-weight:700}
.r-item .r-meta{font-size:9.5px;padding-left:6px}
.r-obs-box{border:1px solid #000;padding:4px 5px;margin-top:5px;font-size:10px}
.r-foot{text-align:center;font-size:9.5px;margin-top:6px}

@media(max-width:1100px){.shell{grid-template-columns:1fr}.order-col{position:static}}
@media(max-width:640px){.hd-inner{padding:12px 14px}.shell{padding:16px 14px 60px}.fl-row.addr2{grid-template-columns:1fr 70px}.size-grid{grid-template-columns:repeat(2,1fr)}.sz-overlay{padding:0;align-items:flex-end}.sz-modal{border-radius:16px 16px 0 0;max-height:88vh;max-height:88dvh}}

@media print{
  html,body{width:auto;height:auto;margin:0;padding:0;background:#fff}
  .flag-stripe,header,.shell,.toast,.sz-overlay{display:none !important}
  #print-area{display:block;position:static;width:auto}
  .receipt{display:none;margin:0 auto}
  body[data-print="cozinha"] #receipt-cozinha{display:block}
  body[data-print="cliente"] #receipt-cliente{display:block}
  @page{size:58mm auto;margin:0}
}
</style>
</head>
<body>
<div class="flag-stripe"></div>
<div class="toast" id="toast"><i class="fa-solid fa-check"></i><span id="toast-msg"></span></div>

<header>
  <div class="hd-inner">
    <div class="hd-brand">
      <div class="hd-logo"><img src="https://github.com/user-attachments/assets/b6cbf35d-93a5-4eb7-ad70-63a79c657b7a" alt="Logo"></div>
      <div>
        <div class="hd-title">PAINEL DE <span>PEDIDOS</span></div>
        <div class="hd-sub">Pizzaria do Gordo · Uso interno</div>
      </div>
    </div>
    <div class="hd-clock"><div class="time" id="clock-time">--:--</div><div class="date" id="clock-date">-</div></div>
  </div>
</header>

<div class="shell">
  <div class="menu-col">
    <div class="tabs-bar">
      <button class="tab-btn active" data-tab="salgadas" type="button"><i class="fa-solid fa-pizza-slice"></i> Salgadas</button>
      <button class="tab-btn tab-doce" data-tab="doces" type="button"><i class="fa-solid fa-cookie-bite"></i> Doces</button>
      <button class="tab-btn tab-beb" data-tab="bebidas" type="button"><i class="fa-solid fa-wine-bottle"></i> Bebidas</button>
    </div>
    <div class="tab-panel active" id="tab-salgadas"><div class="item-list" id="salgadas-list"></div></div>
    <div class="tab-panel" id="tab-doces"><div class="item-list" id="doces-list"></div></div>
    <div class="tab-panel" id="tab-bebidas"><div id="drinks-wrap"></div></div>
  </div>

  <div class="order-col">
    <div class="order-hd"><h3><i class="fa-solid fa-receipt"></i> Pedido Atual</h3><span class="order-count" id="order-count">0</span></div>
    <div class="order-bd" id="order-body"></div>
  </div>
</div>

<!-- Modal tamanho -->
<div class="sz-overlay" id="sz-overlay">
  <div class="sz-modal">
    <div class="sz-hd">
      <div><h3><i class="fa-solid fa-pizza-slice"></i> Escolha o Tamanho</h3><span class="sz-pname" id="sz-pname"></span></div>
      <button class="mod-x" onclick="closeSzModal()" type="button"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="sz-bd">
      <div class="meio-toggle">
        <div class="meio-title"><i class="fa-solid fa-circle-half-stroke"></i> Quantos sabores?</div>
        <div class="frac-chips" id="frac-chips">
          <button class="fchip sel" type="button" data-frac="1">1 sabor</button>
          <button class="fchip" type="button" data-frac="2">2 sabores</button>
          <button class="fchip" type="button" data-frac="3">3 sabores</button>
        </div>
        <div class="flavor-slots" id="flavor-slots"></div>
      </div>
      <div class="size-grid" id="size-grid"></div>
      <div class="borda-sec">
        <div class="borda-title"><i class="fa-solid fa-circle-plus"></i> Borda Recheada (+R$ 5,00)</div>
        <div class="borda-chips" id="borda-chips"></div>
      </div>
      <div class="sz-prev" id="sz-prev">Selecione um tamanho acima</div>
      <button class="btn-add-sz" id="btn-add-sz" onclick="confirmSz()" disabled type="button"><i class="fa-solid fa-cart-plus"></i> Adicionar ao Pedido</button>
    </div>
  </div>
</div>

<!-- Área de impressão (invisível na tela, só aparece no print) -->
<div id="print-area">
  <div class="receipt" id="receipt-cozinha"></div>
  <div class="receipt" id="receipt-cliente"></div>
</div>

<script>
"use strict";
const PIZZARIA={nome:"Pizzaria do Gordo",end:"Rua Aleixo Bezerra, 524 - Centro, Sumé - PB",tel:"(83) 99638-4531"};
const DELIVERY_FEE=2;

/* ---------- Size modal ---------- */
function flavorOptionsHTML(excludeNames,selected){
  const opts=allFlavorNames.filter(n=>!excludeNames.includes(n)||n===selected).map(n=>`<option value="${escapeHtml(n)}" ${n===selected?"selected":""}>${escapeHtml(n)}</option>`).join("");
  return `<option value="">Selecione o sabor...</option>`+opts;
}

function renderFlavorSlots(){
  const wrap=qs("#flavor-slots");
  const n=state.modal.fracoes;
  if(n<=1){wrap.innerHTML="";return}
  const baseName=state.modal.name;
  let html="";
  const ordinal=["1ª","2ª","3ª"];
  const excl2=[baseName,state.modal.flavor3].filter(Boolean);
  html+=`<div><span class="flavor-slot-lbl">${ordinal[1]} fração <span class="req">*</span></span><select class="fl-inp" id="flavor-select-2">${flavorOptionsHTML(excl2,state.modal.flavor2)}</select></div>`;
  if(n===3){
    const excl3=[baseName,state.modal.flavor2].filter(Boolean);
    html+=`<div style="margin-top:8px"><span class="flavor-slot-lbl">${ordinal[2]} fração <span class="req">*</span></span><select class="fl-inp" id="flavor-select-3">${flavorOptionsHTML(excl3,state.modal.flavor3)}</select></div>`;
  }
  wrap.innerHTML=html;
  const sel2=qs("#flavor-select-2");
  if(sel2)sel2.addEventListener("change",e=>{state.modal.flavor2=e.target.value;updateSzPreview()});
  const sel3=qs("#flavor-select-3");
  if(sel3)sel3.addEventListener("change",e=>{state.modal.flavor3=e.target.value;updateSzPreview()});
}

function openSzModal(name){
  state.modal={name,size:"",price:0,borda:"Sem borda",fracoes:1,flavor2:"",flavor3:""};
  qs("#sz-pname").textContent=name;
  document.querySelectorAll(".sopt").forEach(i=>i.classList.remove("sel"));
  document.querySelectorAll(".bchip").forEach(i=>i.classList.toggle("sel",i.dataset.borda==="Sem borda"));
  document.querySelectorAll("#frac-chips .fchip").forEach(i=>i.classList.toggle("sel",i.dataset.frac==="1"));
  renderFlavorSlots();
  updateSzPreview();
  qs("#sz-overlay").classList.add("open");
  qs(".sz-bd").scrollTop=0;
}
function closeSzModal(){qs("#sz-overlay").classList.remove("open")}

function updateSzPreview(){
  const extra=state.modal.borda==="Sem borda"?0:5,btn=qs("#btn-add-sz");
  if(!state.modal.size){qs("#sz-prev").textContent="Selecione um tamanho acima";btn.disabled=true;return}
  const n=state.modal.fracoes;
  if(n>=2&&!state.modal.flavor2){qs("#sz-prev").textContent="Escolha o segundo sabor";btn.disabled=true;return}
  if(n===3&&!state.modal.flavor3){qs("#sz-prev").textContent="Escolha o terceiro sabor";btn.disabled=true;return}
  let label;
  if(n===1){
    label=`Pizza <strong>${state.modal.size}</strong>`;
  }else if(n===2){
    label=`1/2 <strong>${escapeHtml(state.modal.name)}</strong> + 1/2 <strong>${escapeHtml(state.modal.flavor2)}</strong>`;
  }else{
    label=`1/3 <strong>${escapeHtml(state.modal.name)}</strong> + 1/3 <strong>${escapeHtml(state.modal.flavor2)}</strong> + 1/3 <strong>${escapeHtml(state.modal.flavor3)}</strong>`;
  }
  const sizeTxt=n>1?` - Tamanho <strong>${state.modal.size}</strong>`:"";
  qs("#sz-prev").innerHTML=`${label}${sizeTxt}${extra?` + Borda ${escapeHtml(state.modal.borda)}`:""} = <strong>${money(state.modal.price+extra)}</strong>`;
  btn.disabled=false;
}

function confirmSz(){
  if(!state.modal.size)return;
  const n=state.modal.fracoes;
  if(n>=2&&!state.modal.flavor2)return;
  if(n===3&&!state.modal.flavor3)return;
  const extra=state.modal.borda==="Sem borda"?0:5,bordaTxt=extra?` (Borda ${state.modal.borda})`:"";
  let name;
  if(n===1){
    name=`${state.modal.name} - ${state.modal.size}${bordaTxt}`;
  }else if(n===2){
    name=`1/2 ${state.modal.name} + 1/2 ${state.modal.flavor2} - ${state.modal.size}${bordaTxt}`;
  }else{
    name=`1/3 ${state.modal.name} + 1/3 ${state.modal.flavor2} + 1/3 ${state.modal.flavor3} - ${state.modal.size}${bordaTxt}`;
  }
  addToCart(name,state.modal.price+extra);
  closeSzModal();
}

/* ---------- Cart ---------- */
function addToCart(name,price){const cur=state.cart.find(i=>i.name===name);if(cur)cur.qty++;else state.cart.push({name,price:Number(price),qty:1});renderOrder();showToast("+ "+name.split(" - ")[0])}
function removeItem(name){state.cart=state.cart.filter(i=>i.name!==name);renderOrder()}
function changeQty(name,delta){const item=state.cart.find(i=>i.name===name);if(!item)return;item.qty+=delta;if(item.qty<=0)removeItem(name);else renderOrder()}
function getSubtotal(){return state.cart.reduce((s,i)=>s+i.price*i.qty,0)}
function getDeliveryFee(){return state.modalidade==="delivery"?DELIVERY_FEE:0}
function getTotal(){return getSubtotal()+getDeliveryFee()}
function getQty(){return state.cart.reduce((s,i)=>s+i.qty,0)}
function isAddrOk(){return state.modalidade!=="delivery"||Boolean(state.addr.rua&&state.addr.numero&&state.addr.bairro)}

/* ---------- Receipts ---------- */
function nowStr(){const d=new Date();const dd=String(d.getDate()).padStart(2,"0"),mm=String(d.getMonth()+1).padStart(2,"0"),hh=String(d.getHours()).padStart(2,"0"),mi=String(d.getMinutes()).padStart(2,"0");return `${dd}/${mm} ${hh}:${mi}`}

function buildReceiptCozinha(){
  const modo=state.modalidade==="delivery"?"DELIVERY":"PRESENCIAL";
  let refCliente="";
  if(state.modalidade==="presencial"&&state.cliente.mesa) refCliente=`<div class="r-row"><span>Mesa/Comanda:</span><span><strong>${escapeHtml(state.cliente.mesa)}</strong></span></div>`;
  else if(state.cliente.nome) refCliente=`<div class="r-row"><span>Cliente:</span><span><strong>${escapeHtml(state.cliente.nome)}</strong></span></div>`;
  const itens=state.cart.map(i=>`<div class="r-item"><div class="r-row"><span>${i.qty}x ${escapeHtml(i.name)}</span></div></div>`).join("");
  return `
    <div class="r-center"><div class="r-title">*** COZINHA ***</div><div class="r-sub">${escapeHtml(PIZZARIA.nome)}</div></div>
    <div class="r-tag">${modo}</div>
    <div class="r-row"><span>Pedido:</span><span>${nowStr()}</span></div>
    ${refCliente}
    <div class="r-line"></div>
    ${itens}
    <div class="r-line"></div>
    ${state.obs.trim()?`<div class="r-obs-box"><strong>OBS:</strong> ${escapeHtml(state.obs.trim())}</div>`:""}
  `;
}

function buildReceiptCliente(){
  const modo=state.modalidade==="delivery"?"DELIVERY":"PRESENCIAL";
  const payLabel={dinheiro:"Dinheiro",pix:"Pix",debito:"Cartão Débito",credito:"Cartão Crédito"}[state.pagamento]||"—";
  const itens=state.cart.map(i=>`<div class="r-item"><div class="r-row"><span>${i.qty}x ${escapeHtml(i.name)}</span><span>${money(i.price*i.qty)}</span></div></div>`).join("");
  let trocoLine="";
  if(state.pagamento==="dinheiro"){
    if(state.troco==="50")trocoLine=`<div class="r-row"><span>Troco para:</span><span>${money(50)}</span></div>`;
    else if(state.troco==="100")trocoLine=`<div class="r-row"><span>Troco para:</span><span>${money(100)}</span></div>`;
    else if(state.troco==="outro"&&state.trocoCustom)trocoLine=`<div class="r-row"><span>Troco para:</span><span>${money(state.trocoCustom)}</span></div>`;
    else if(state.troco==="nao")trocoLine=`<div class="r-row"><span>Troco:</span><span>Não precisa</span></div>`;
  }
  const enderecoBlock=state.modalidade==="delivery"?`<div class="r-line"></div><div class="r-row"><span><strong>Endereço:</strong></span></div><div>${escapeHtml(state.addr.rua)}, ${escapeHtml(state.addr.numero)} - ${escapeHtml(state.addr.bairro)}${state.addr.ref?` (Ref: ${escapeHtml(state.addr.ref)})`:""}</div>`:"";
  const clienteLine=state.cliente.nome?`<div class="r-row"><span>Cliente:</span><span>${escapeHtml(state.cliente.nome)}</span></div>`:"";
  const mesaLine=state.modalidade==="presencial"&&state.cliente.mesa?`<div class="r-row"><span>Mesa:</span><span>${escapeHtml(state.cliente.mesa)}</span></div>`:"";
  return `
    <div class="r-center"><div class="r-title">${escapeHtml(PIZZARIA.nome)}</div><div class="r-sub">${escapeHtml(PIZZARIA.end)}</div><div class="r-sub">${escapeHtml(PIZZARIA.tel)}</div></div>
    <div class="r-line"></div>
    <div class="r-center r-sub"><strong>CUPOM DO CLIENTE</strong></div>
    <div class="r-tag">${modo}</div>
    <div class="r-row"><span>Data/Hora:</span><span>${nowStr()}</span></div>
    ${clienteLine}${mesaLine}
    <div class="r-line"></div>
    ${itens}
    <div class="r-line"></div>
    <div class="r-row"><span>Subtotal:</span><span>${money(getSubtotal())}</span></div>
    ${state.modalidade==="delivery"?`<div class="r-row"><span>Entrega:</span><span>${money(DELIVERY_FEE)}</span></div>`:""}
    <div class="r-row" style="font-weight:800;font-size:13px"><span>TOTAL:</span><span>${money(getTotal())}</span></div>
    <div class="r-line"></div>
    <div class="r-row"><span>Pagamento:</span><span>${payLabel}</span></div>
    ${trocoLine}
    ${enderecoBlock}
    ${state.obs.trim()?`<div class="r-obs-box"><strong>Obs:</strong> ${escapeHtml(state.obs.trim())}</div>`:""}
    <div class="r-foot">Obrigado pela preferência!<br>Volte sempre 🍕</div>
  `;
}

function printReceipt(type){
  if(!state.cart.length){showToast("Adicione itens ao pedido antes de imprimir",true);return}
  if(type==="cliente"){
    if(!state.pagamento){showToast("Selecione a forma de pagamento",true);return}
    if(!isAddrOk()){showToast("Preencha o endereço de entrega",true);return}
    qs("#receipt-cliente").innerHTML=buildReceiptCliente();
  }else{
    qs("#receipt-cozinha").innerHTML=buildReceiptCozinha();
  }
  document.body.setAttribute("data-print",type);
  window.print();
}

function newOrder(){
  if(state.cart.length&&!confirm("Iniciar um novo pedido? O pedido atual será descartado."))return;
  state.cart=[];state.modalidade="presencial";state.cliente={nome:"",telefone:"",mesa:""};state.addr={rua:"",numero:"",bairro:"",ref:""};state.pagamento="";state.troco="";state.trocoCustom="";state.obs="";
  renderOrder();showToast("Novo pedido iniciado");
}

/* ---------- Tabs / toast / clock ---------- */
function showTab(id){document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===id));qs("#tab-"+id)?.classList.add("active")}
let toastTimer;function showToast(m,warn){const t=qs("#toast");qs("#toast-msg").textContent=m;t.classList.toggle("warn",Boolean(warn));t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2600)}
function tickClock(){const d=new Date();qs("#clock-time").textContent=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});qs("#clock-date").textContent=d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"})}

/* ---------- Init ---------- */
function init(){
  renderItemList(salgadas,"salgadas-list",false);
  renderItemList(doces,"doces-list",true);
  renderDrinks();
  renderSizeOptions();
  renderOrder();
  tickClock();setInterval(tickClock,15000);

  document.addEventListener("click",e=>{
    const pizzaRow=e.target.closest(".item-row[data-pizza]");
    if(pizzaRow&&e.target.closest(".btn-tam")){openSzModal(pizzaRow.dataset.pizza);return}
    const tabBtn=e.target.closest("[data-tab]");
    if(tabBtn){showTab(tabBtn.dataset.tab);return}
    const drinkBtn=e.target.closest("[data-drink]");
    if(drinkBtn){addToCart(drinkBtn.dataset.drink,drinkBtn.dataset.price);return}
    const fracBtn=e.target.closest("[data-frac]");
    if(fracBtn){
      document.querySelectorAll("#frac-chips .fchip").forEach(i=>i.classList.remove("sel"));
      fracBtn.classList.add("sel");
      state.modal.fracoes=Number(fracBtn.dataset.frac);
      if(state.modal.fracoes<3)state.modal.flavor3="";
      if(state.modal.fracoes<2)state.modal.flavor2="";
      renderFlavorSlots();
      updateSzPreview();
      return;
    }
    const sizeBtn=e.target.closest("[data-size]");
    if(sizeBtn){document.querySelectorAll(".sopt").forEach(i=>i.classList.remove("sel"));sizeBtn.classList.add("sel");state.modal.size=sizeBtn.dataset.size;state.modal.price=Number(sizeBtn.dataset.price);updateSzPreview();return}
    const bordaBtn=e.target.closest("[data-borda]");
    if(bordaBtn){document.querySelectorAll(".bchip").forEach(i=>i.classList.remove("sel"));bordaBtn.classList.add("sel");state.modal.borda=bordaBtn.dataset.borda;updateSzPreview();return}
    const qtyBtn=e.target.closest("[data-qname]");
    if(qtyBtn){changeQty(qtyBtn.dataset.qname,Number(qtyBtn.dataset.delta));return}
    const delBtn=e.target.closest("[data-rname]");
    if(delBtn){removeItem(delBtn.dataset.rname);return}
    const modoBtn=e.target.closest("[data-modo]");
    if(modoBtn){syncInputs();state.modalidade=modoBtn.dataset.modo;renderOrder();return}
    const payBtn=e.target.closest("[data-pay]");
    if(payBtn){syncInputs();state.pagamento=payBtn.dataset.pay;if(state.pagamento!=="dinheiro"){state.troco="";state.trocoCustom=""}renderOrder();return}
    const trocoBtn=e.target.closest("[data-troco]");
    if(trocoBtn){syncInputs();state.troco=trocoBtn.dataset.troco;if(state.troco!=="outro")state.trocoCustom="";renderOrder();return}
    if(e.target.closest("#btn-print-kitchen")){printReceipt("cozinha");return}
    if(e.target.closest("#btn-print-client")){printReceipt("cliente");return}
    if(e.target.closest("#btn-new-order")){newOrder();return}
  });

  document.addEventListener("input",e=>{
    if(e.target.matches("[data-cli]"))state.cliente[e.target.dataset.cli]=e.target.value;
    if(e.target.matches("[data-addr]"))state.addr[e.target.dataset.addr]=e.target.value;
    if(e.target.id==="obs-inp")state.obs=e.target.value;
    if(e.target.id==="troco-custom")state.trocoCustom=e.target.value;
  });

  qs("#sz-overlay").addEventListener("click",e=>{if(e.target.id==="sz-overlay")closeSzModal()});
  window.addEventListener("keydown",e=>{if(e.key==="Escape")closeSzModal()});
}
function syncInputs(){const obs=qs("#obs-inp");if(obs)state.obs=obs.value;const tc=qs("#troco-custom");if(tc)state.trocoCustom=tc.value}
document.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
